<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TdeTruco · Pulpería</title>
<script src="comun.js"></script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a0f08; }
  #fondo { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }

  /* Luz del farol y viñeta (por debajo de las cartas para que se lean nítidas) */
  #luz { position: fixed; inset: 0; z-index: 4; pointer-events: none; mix-blend-mode: soft-light;
    background: radial-gradient(ellipse 55% 60% at 50% 8%, rgba(255,200,110,.9), rgba(255,160,60,.25) 45%, transparent 75%);
    animation: titila 2.8s infinite; }
  @keyframes titila { 0%,100% { opacity: .95 } 20% { opacity: .82 } 23% { opacity: 1 } 55% { opacity: .88 } 70% { opacity: .97 } }
  #vineta { position: fixed; inset: 0; z-index: 4; pointer-events: none;
    background: radial-gradient(ellipse 80% 75% at 50% 42%, transparent 55%, rgba(10,5,2,.65)); }

  /* Mesa de madera en perspectiva */
  #mesa { position: fixed; left: 50%; top: 38vh; width: 150vw; height: 110vh; transform: translateX(-50%);
    border-radius: 50%; z-index: 3;
    background:
      radial-gradient(ellipse 40% 30% at 50% 18%, rgba(255,205,130,.32), transparent 70%),
      repeating-linear-gradient(0deg, rgba(20,8,2,.35) 0 2px, transparent 2px 7vh),
      repeating-linear-gradient(90deg, rgba(255,230,190,.035) 0 2px, transparent 2px 9px, rgba(0,0,0,.03) 9px 12px, transparent 12px 23px),
      linear-gradient(#80502a, #5c341a 40%, #4a2913);
    box-shadow: inset 0 0 0 16px #3f2210, inset 0 0 0 18px #6b3f1f, inset 0 22px 40px rgba(0,0,0,.45), 0 -6px 30px rgba(0,0,0,.5); }

  .deco { position: fixed; z-index: 4; pointer-events: none; filter: drop-shadow(0 6px 6px rgba(0,0,0,.45)); }
  #mate { left: calc(50% - 36vw); top: 60vh; width: 17vh; }

  /* Gauchos */
  .avatar { position: fixed; z-index: 2; }
  .avatar svg { width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 10px 12px rgba(0,0,0,.45)); }
  #av2 { left: 50%; top: 12vh; width: 25vh; height: 33vh; margin-left: -12.5vh; }
  #av1 { left: calc(50% + 30vw); top: 13vh; width: 29vh; height: 38vh; margin-left: -14.5vh; transform: perspective(900px) rotateY(-24deg); }
  #av3 { left: calc(50% - 30vw); top: 13vh; width: 29vh; height: 38vh; margin-left: -14.5vh; transform: perspective(900px) rotateY(24deg); }
  .placa { position: fixed; z-index: 4; transform: translateX(-50%); background: linear-gradient(#4a2c16, #2e1a0c);
    color: #f3d9a0; border: 1px solid rgba(232,196,106,.45); border-radius: 7px; padding: 3px 12px;
    font: 700 14px Georgia, serif; white-space: nowrap; box-shadow: 0 3px 8px rgba(0,0,0,.5); }
  .placa i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
  .placa small { font: 400 11px system-ui; color: #cdb896; margin-left: 4px; }
  #placa2 { left: calc(50% - 21vh); top: 41vh; }
  #placa1 { left: calc(50% + 30vw); top: 45.5vh; }
  #placa3 { left: calc(50% - 30vw); top: 45.5vh; }

  .respira { animation: respirar 3.6s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
  #av1 .respira { animation-delay: -1.2s } #av3 .respira { animation-delay: -2.3s }
  @keyframes respirar { 50% { transform: translateY(-2px) scaleY(1.008); } }
  .avatar .anim { transition: transform .18s ease, opacity .15s; transform-box: fill-box; transform-origin: center; }
  .avatar .cabeza { transition: transform .25s ease; transform-box: fill-box; transform-origin: 50% 92%; }
  .avatar .parpadeo { animation: parpadear 4.2s infinite; transform-box: fill-box; transform-origin: center; }
  #av1 .parpadeo { animation-delay: 1.3s } #av3 .parpadeo { animation-delay: 2.6s }
  @keyframes parpadear { 0%, 94%, 100% { transform: scaleY(1) } 96% { transform: scaleY(.08) } }
  .avatar .bv { opacity: 0 }
  .avatar .bv.normal { opacity: 1 }

  .s-anchoEspada .ceja-i { transform: translateY(-10px) rotate(-10deg) }
  .s-anchoEspada .ceja-d { transform: translateY(-10px) rotate(10deg) }
  .s-anchoBasto .ojo-d { transform: scaleY(.08) }
  .s-anchoBasto .ceja-d { transform: translateY(4px) }
  .s-sieteEspada .boca { transform: translateX(12px) rotate(-16deg) }
  .s-sieteOro .boca { transform: translateX(-12px) rotate(16deg) }
  .s-nada .ojo { transform: scaleY(.08) }
  .s-envido .cabeza { transform: rotate(13deg) }
  .s-tres .bv.normal, .s-dos .bv.normal, .s-anchoFalso .bv.normal, .hablando .bv.normal { opacity: 0 }
  .s-tres .bv.mordida, .s-dos .bv.pico, .s-anchoFalso .bv.abierta, .hablando .bv.abierta { opacity: 1 }
  .hablando .bv.abierta { animation: hablar .14s infinite alternate; transform-box: fill-box; transform-origin: center top }
  @keyframes hablar { from { transform: scaleY(.35) } to { transform: scaleY(1) } }
  .asiente .cabeza { animation: asentir .5s ease 1 }
  @keyframes asentir { 30% { transform: translateY(5px) } 60% { transform: translateY(-2px) } }

  /* Cartas */
  .carta { position: fixed; left: 0; top: 0; width: 130px; height: 200px; z-index: 5;
    transform-style: preserve-3d; transition: transform .5s cubic-bezier(.45,.05,.3,1); }
  .carta img { position: absolute; inset: 0; width: 100%; height: 100%; backface-visibility: hidden;
    border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,.45); transition: box-shadow .3s, filter .3s; }
  .carta img.dorso { transform: rotateY(180deg) }
  .carta.mia { z-index: 8; cursor: pointer }
  .carta.rapida { transition-duration: .18s }
  .carta.ganadora img.frente { box-shadow: 0 0 0 4px #f3c94a, 0 0 26px 8px rgba(243,201,74,.75); }
  .carta.vieja img.frente { filter: brightness(.8) saturate(.8); }
</style>
</head>

<script>
const T = window.Truco;
const L = '#2b1a10';

// ------------------------------------------------------------ Gauchos (SVG)
function gauchoSVG(o) {
  const { id, poncho, guarda, panuelo, piel, pelo, cejas, rx, ry } = o;
  const PONCHO = 'M-8 272 Q-2 198 100 184 Q202 198 208 272 Z';
  let zig = '';
  for (let x = -10, i = 0; x <= 212; x += 14, i++) zig += `${x},${i % 2 ? 262 : 250} `;

  const peloAtras = o.sombrero === 'vincha'
    ? `<path d="M46 84 Q34 170 58 200 L142 200 Q166 170 154 84Z" fill="${pelo}" stroke="${L}" stroke-width="3"/>` : '';

  const barbas = {
    completa: `<path d="M${100 - rx + 3} 104 Q${100 - rx + 4} 170 100 ${100 + ry + 26} Q${100 + rx - 4} 170 ${100 + rx - 3} 104
      Q${100 + rx - 12} 148 122 152 Q100 160 78 152 Q${100 - rx + 12} 148 ${100 - rx + 3} 104Z" fill="${pelo}" stroke="${L}" stroke-width="3"/>
      <path d="M84 168 q4 8 0 14 M100 172 q3 8 0 16 M116 168 q-4 8 0 14" stroke="${L}" stroke-opacity=".3" stroke-width="2" fill="none"/>`,
    candado: `<path d="M84 150 Q100 182 116 150 Q100 160 84 150Z" fill="${pelo}" stroke="${L}" stroke-width="2.5"/>`,
    bigotazo: `<path d="M${100 - rx + 6} 120 Q${100 - rx + 10} 150 82 156 M${100 + rx - 6} 120 Q${100 + rx - 10} 150 118 156"
      stroke="${pelo}" stroke-opacity=".35" stroke-width="7" fill="none"/>`,
  };
  const bigotes = {
    completa: `<path d="M-24 -7 Q-10 -18 0 -12 Q10 -18 24 -7 Q12 -2 0 -6 Q-12 -2 -24 -7Z" fill="${pelo}" stroke="${L}" stroke-width="2.5"/>`,
    candado: `<path d="M-19 -8 Q0 -17 19 -8 Q8 -6 0 -9 Q-8 -6 -19 -8Z" fill="${pelo}" stroke="${L}" stroke-width="2.5"/>`,
    bigotazo: `<path d="M-36 -14 Q-38 -4 -28 -3 Q-18 -2 -10 -9 Q-4 -15 0 -11 Q4 -15 10 -9 Q18 -2 28 -3 Q38 -4 36 -14
      Q30 -6 22 -9 Q12 -16 0 -15 Q-12 -16 -22 -9 Q-30 -6 -36 -14Z" fill="${pelo}" stroke="${L}" stroke-width="2.5"/>`,
  };
  const sombreros = {
    chambergo: `
      <ellipse cx="100" cy="56" rx="98" ry="17" fill="${o.sombreroColor}" stroke="${L}" stroke-width="3"/>
      <path d="M50 58 Q48 6 100 4 Q152 6 150 58Z" fill="${o.sombreroColor}" stroke="${L}" stroke-width="3"/>
      <path d="M49 44 Q100 34 151 44 L151 56 Q100 46 49 56Z" fill="${o.cinta}" stroke="${L}" stroke-width="2.5"/>
      <path d="M70 14 Q100 6 120 12" stroke="#fff" stroke-opacity=".12" stroke-width="6" fill="none"/>`,
    boina: `
      <path d="M50 74 Q46 60 56 54 Q60 70 64 80Z M150 74 Q154 60 144 54 Q140 70 136 80Z" fill="${pelo}"/>
      <ellipse cx="96" cy="50" rx="64" ry="22" transform="rotate(-8 96 50)" fill="${o.sombreroColor}" stroke="${L}" stroke-width="3"/>
      <path d="M44 64 Q100 50 154 58" stroke="${L}" stroke-width="7" fill="none"/>
      <path d="M44 64 Q100 50 154 58" stroke="${o.sombreroColor}" stroke-width="4" fill="none"/>
      <path d="M98 29 L103 18" stroke="${L}" stroke-width="5" stroke-linecap="round"/>`,
    vincha: `
      <path d="M48 94 Q42 34 100 32 Q158 34 152 94 Q146 64 128 60 Q100 70 72 60 Q54 64 48 94Z" fill="${pelo}" stroke="${L}" stroke-width="3"/>
      <path d="M47 70 Q100 56 153 70 L153 84 Q100 70 47 84Z" fill="${o.cinta}" stroke="${L}" stroke-width="2.5"/>
      <path d="M48 76 Q30 96 36 130 L44 128 Q40 100 52 82Z" fill="${o.cinta}" stroke="${L}" stroke-width="2.5"/>`,
  };
  const nariz = o.nariz === 'grande'
    ? `<path d="M100 100 Q86 126 96 132 Q104 136 112 128" fill="none" stroke="${L}" stroke-width="3.2" stroke-linecap="round"/>`
    : `<path d="M101 108 Q94 122 100 125 Q105 126 107 122" fill="none" stroke="${L}" stroke-width="3" stroke-linecap="round"/>`;
  const arrugas = o.arrugas
    ? `<path d="M80 70 Q100 64 120 70 M84 62 Q100 57 116 62" stroke="${L}" stroke-opacity=".35" stroke-width="2" fill="none"/>
       <path d="M60 102 l-8 -3 M60 108 l-8 1 M140 102 l8 -3 M140 108 l8 1" stroke="${L}" stroke-opacity=".35" stroke-width="2"/>` : '';

  return `
  <svg viewBox="-12 -24 224 300">
    <defs><clipPath id="cp-${id}"><path d="${PONCHO}"/></clipPath></defs>
    <g class="respira">
      <rect x="84" y="146" width="32" height="44" rx="10" fill="${piel}" stroke="${L}" stroke-width="3"/>
      <path d="${PONCHO}" fill="${poncho}" stroke="${L}" stroke-width="3"/>
      <g clip-path="url(#cp-${id})">
        <path d="M30 200 Q36 240 30 280 M170 200 Q164 240 170 280 M100 220 L100 280" stroke="#000" stroke-opacity=".15" stroke-width="3" fill="none"/>
        <rect x="-20" y="238" width="260" height="8" fill="${guarda}"/>
        <polyline points="${zig}" fill="none" stroke="${guarda}" stroke-width="4"/>
        <rect x="-20" y="266" width="260" height="6" fill="${guarda}"/>
      </g>
      <path d="M72 182 L128 182 L100 226 Z" fill="${panuelo}" stroke="${L}" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="100" cy="188" r="7" fill="${panuelo}" stroke="${L}" stroke-width="2.5"/>
      <g class="cabeza">
        ${peloAtras}
        <ellipse cx="${100 - rx + 3}" cy="106" rx="10" ry="15" fill="${piel}" stroke="${L}" stroke-width="3"/>
        <ellipse cx="${100 + rx - 3}" cy="106" rx="10" ry="15" fill="${piel}" stroke="${L}" stroke-width="3"/>
        <ellipse cx="100" cy="100" rx="${rx}" ry="${ry}" fill="${piel}" stroke="${L}" stroke-width="3"/>
        ${barbas[o.barba]}
        ${arrugas}
        <circle cx="70" cy="124" r="10" fill="#d8644a" opacity=".25"/>
        <circle cx="130" cy="124" r="10" fill="#d8644a" opacity=".25"/>
        <g transform="translate(78 102)"><g class="anim ojo ojo-i"><g class="parpadeo">
          <ellipse rx="10" ry="11" fill="#fff" stroke="${L}" stroke-width="2.5"/><circle cx="1" cy="1" r="5.5" fill="${L}"/><circle cx="3" cy="-2" r="1.8" fill="#fff"/>
        </g></g></g>
        <g transform="translate(122 102)"><g class="anim ojo ojo-d"><g class="parpadeo">
          <ellipse rx="10" ry="11" fill="#fff" stroke="${L}" stroke-width="2.5"/><circle cx="-1" cy="1" r="5.5" fill="${L}"/><circle cx="1" cy="-2" r="1.8" fill="#fff"/>
        </g></g></g>
        <g transform="translate(78 82)"><path class="anim ceja ceja-i" d="M-15 3 Q-2 -7 14 -1 L14 4 Q-2 -2 -15 7Z" fill="${cejas}" stroke="${L}" stroke-width="1.5"/></g>
        <g transform="translate(122 82)"><path class="anim ceja ceja-d" d="M15 3 Q2 -7 -14 -1 L-14 4 Q2 -2 15 7Z" fill="${cejas}" stroke="${L}" stroke-width="1.5"/></g>
        ${nariz}
        <g transform="translate(100 142)"><g class="anim boca">
          <rect x="-38" y="-20" width="76" height="40" fill="none"/>
          <path class="anim bv normal" d="M-13 -1 Q0 7 13 -1" fill="none" stroke="${L}" stroke-width="3.5" stroke-linecap="round"/>
          <g class="anim bv mordida">
            <path d="M-14 -2 Q0 8 14 -2" fill="#9a2e2e" stroke="${L}" stroke-width="3" stroke-linecap="round"/>
            <rect x="-9" y="-3" width="18" height="6" rx="2" fill="#fff" stroke="${L}" stroke-width="2"/>
          </g>
          <g class="anim bv pico">
            <ellipse cx="0" cy="1" rx="6" ry="7.5" fill="#c0504a" stroke="${L}" stroke-width="3"/>
            <path d="M-3 1 Q0 3 3 1" stroke="${L}" stroke-width="2" fill="none"/>
          </g>
          <g class="anim bv abierta">
            <ellipse cx="0" cy="4" rx="12" ry="11" fill="#3a0e0e" stroke="${L}" stroke-width="3"/>
            <ellipse cx="0" cy="10" rx="7" ry="4" fill="#d0605a"/>
          </g>
          ${bigotes[o.barba]}
        </g></g>
        ${sombreros[o.sombrero]}
      </g>
    </g>
  </svg>`;
}

const avs = [null, ...[1, 2, 3].map((i) => document.getElementById('av' + i))];
avs[1].innerHTML = gauchoSVG({
  id: 'facundo', sombrero: 'chambergo', sombreroColor: '#1d1712', cinta: '#7b1e2b', barba: 'bigotazo',
  poncho: '#8e2a22', guarda: '#1d1712', panuelo: '#c0392b', piel: '#c98f62', pelo: '#1d1712', cejas: '#1d1712',
  rx: 50, ry: 60, nariz: 'grande',
});
avs[2].innerHTML = gauchoSVG({
  id: 'ramon', sombrero: 'boina', sombreroColor: '#1c2533', barba: 'candado',
  poncho: '#2c4f7c', guarda: '#efe6d0', panuelo: '#6fa8dc', piel: '#e8b48c', pelo: '#5a3418', cejas: '#5a3418',
  rx: 55, ry: 57, nariz: 'chica',
});
avs[3].innerHTML = gauchoSVG({
  id: 'chacho', sombrero: 'vincha', cinta: '#b3261e', barba: 'completa',
  poncho: '#7a5a3a', guarda: '#b3261e', panuelo: '#7b1e2b', piel: '#a8714a', pelo: '#d9d3c7', cejas: '#cfc8ba',
  rx: 48, ry: 63, nariz: 'grande', arrugas: true,
});

// ------------------------------------------------------------ Cartas
const imgs = new Map();
function imagen(c) {
  const key = c ? c.n + c.p : 'dorso';
  if (!imgs.has(key)) imgs.set(key, (c ? T.canvasCarta(c) : T.canvasDorso()).toDataURL());
  return imgs.get(key);
}
function crearCarta(c) {
  const el = document.createElement('div');
  el.className = 'carta';
  el.innerHTML = `<img class="frente" src="${imagen(c)}" alt=""><img class="dorso" src="${imagen(null)}" alt="">`;
  document.body.appendChild(el);
  return el;
}
const CW = 130, CH = 200;
// Siempre la misma lista de funciones, para que el navegador interpole bien entre posiciones.
function tf(el, { x, y, rx = 0, ry = 0, rz = 0, s = 1 }) {
  el.style.transform = `translate(${x - CW / 2}px, ${y - CH / 2}px) perspective(800px) rotateX(${rx}deg) rotateY(${ry}deg) rotateZ(${rz}deg) scale(${s})`;
}
const U = () => innerHeight / 900;
const escalaMesa = () => (innerHeight * 0.17) / (CH * 0.95);

// Cartas jugadas: grandes, derechas y mirando hacia vos. Cada baza se apila corriéndose a la derecha.
const OFFSET = [[0, 90], [235, 0], [0, -90], [-235, 0]];
function posJugada(s, baza, giro) {
  const u = U();
  return {
    x: innerWidth / 2 + OFFSET[s][0] * u + (baza - 1) * 30 * u,
    y: innerHeight * 0.56 + OFFSET[s][1] * u,
    rx: 16, rz: giro, s: escalaMesa(),
  };
}
function posManoBot(s, i) {
  const u = U();
  const base = { 1: [innerWidth / 2 + innerWidth * 0.3, innerHeight * 0.57], 2: [innerWidth / 2 + 150 * u, innerHeight * 0.43], 3: [innerWidth / 2 - innerWidth * 0.3, innerHeight * 0.57] }[s];
  return { x: base[0] + (i - 1) * 24 * u, y: base[1], rx: 48, ry: 180, rz: (i - 1) * 14, s: 0.42 * u };
}
function posMazo() { return { x: innerWidth / 2, y: innerHeight * 0.56, rx: 40, ry: 180, s: 0.5 * U() }; }

let miMano = [], manosBot = [[], [], [], []], cartasMesa = [], actuales = {}, hover = -1;
function posEnMano(i, total) {
  const off = i - (total - 1) / 2, u = U(), arriba = i === hover;
  return {
    x: innerWidth / 2 + off * 122 * u,
    y: innerHeight - 88 * u + Math.abs(off) * 12 * u - (arriba ? 42 * u : 0),
    rz: off * 8, s: (arriba ? 1.16 : 1.1) * u,
  };
}
function reacomodarMano() { miMano.forEach((el, i) => tf(el, posEnMano(i, miMano.length))); }
function reubicarTodo() {
  reacomodarMano();
  manosBot.forEach((m, s) => m.forEach((el, i) => tf(el, posManoBot(s, i))));
  cartasMesa.forEach((el) => tf(el, posJugada(el._s, el._baza, el._giro)));
}

const siguienteFrame = () => new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));

// ------------------------------------------------------------ Burbujas
const burbujas = [0, 1, 2, 3].map(() => T.crearBurbuja());
function ubicarBurbujas() {
  for (let s = 1; s < 4; s++) {
    const r = avs[s].getBoundingClientRect();
    burbujas[s].style.left = r.left + r.width / 2 + 'px';
    burbujas[s].style.top = r.top + r.height * 0.02 + 'px';
  }
  burbujas[0].style.left = innerWidth / 2 - 300 * U() + 'px';
  burbujas[0].style.top = innerHeight - 150 * U() + 'px';
}
ubicarBurbujas();
addEventListener('resize', () => { ubicarBurbujas(); reubicarTodo(); });

// ------------------------------------------------------------ Vista para el motor
const timersSena = {};
function claseSena(s, k) {
  const el = avs[s];
  [...el.classList].filter((c) => c.startsWith('s-')).forEach((c) => el.classList.remove(c));
  if (k) el.classList.add('s-' + k);
}

const vista = {
  async repartir(manos) {
    const todos = [];
    miMano = manos[0].map((c) => { const el = crearCarta(c); el.classList.add('mia'); todos.push(el); return el; });
    for (let s = 1; s < 4; s++) manosBot[s] = manos[s].map(() => { const el = crearCarta(null); todos.push(el); return el; });
    todos.forEach((el) => tf(el, posMazo()));
    miMano.forEach((el) => {
      el.onmouseenter = () => { hover = miMano.indexOf(el); reacomodarMano(); };
      el.onmouseleave = () => { hover = -1; reacomodarMano(); };
      el.onclick = () => T.jugarMiCarta(miMano.indexOf(el));
    });
    await siguienteFrame();
    for (let i = 0; i < 3; i++) {
      for (let s = 1; s < 4; s++) { tf(manosBot[s][i], posManoBot(s, i)); await T.esperar(70); }
      tf(miMano[i], posEnMano(i, 3));
      await T.esperar(90);
    }
    await T.esperar(500);
    miMano.forEach((el) => el.classList.add('rapida'));
  },

  async jugarCarta(s, idx, carta, baza) {
    let el;
    if (s === 0) {
      hover = -1;
      el = miMano.splice(idx, 1)[0];
      el.classList.remove('mia', 'rapida');
      el.onclick = el.onmouseenter = el.onmouseleave = null;
      reacomodarMano();
    } else {
      el = manosBot[s].splice(idx, 1)[0];
      el.querySelector('.frente').src = imagen(carta);
    }
    Object.assign(el, { _s: s, _baza: baza, _giro: (Math.random() - 0.5) * 6 });
    el.style.zIndex = 5 + baza;
    cartasMesa.push(el);
    actuales[s] = el;
    tf(el, posJugada(s, baza, el._giro));
    await T.esperar(520);
  },

  decir(s, txt, ms) {
    T.mostrarBurbuja(burbujas[s], txt, ms);
    if (s > 0) {
      avs[s].classList.add('hablando');
      setTimeout(() => avs[s].classList.remove('hablando'), 700);
    }
  },

  sena(s, k) {
    if (s === 0) return;
    claseSena(s, k);
    clearTimeout(timersSena[s]);
    timersSena[s] = setTimeout(() => claseSena(s, null), 1500);
  },

  resaltar(s) {
    if (s === null || s === undefined) return;
    actuales[s]?.classList.add('ganadora');
    if (s > 0) {
      avs[s].classList.add('asiente');
      setTimeout(() => avs[s].classList.remove('asiente'), 600);
    }
  },

  async finBaza() {
    Object.values(actuales).forEach((el) => { el.classList.remove('ganadora'); el.classList.add('vieja'); });
    actuales = {};
  },

  async limpiarMesa() {
    const todas = [...cartasMesa, ...manosBot.flat(), ...miMano];
    if (!todas.length) return;
    todas.forEach((el) => { el.classList.remove('rapida', 'ganadora'); tf(el, posMazo()); });
    await T.esperar(550);
    todas.forEach((el) => el.remove());
    cartasMesa = []; miMano = []; manosBot = [[], [], [], []]; actuales = {};
  },
};

T.iniciar(vista, { nombres: ['Vos', 'Facundo', 'Ramón', 'Don Chacho'] });
</script>
